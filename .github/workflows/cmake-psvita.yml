name: Build PSVita (CMake)

on:
  push:
    branches: [ vita ]
  pull_request:
    branches: [ vita ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VITASDK: ${{ github.workspace }}/vitasdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make python3 curl git pkg-config

      - name: Install VitaSDK and packages
        run: |
          set -e
          git clone --depth 1 https://github.com/vitasdk/vdpm.git
          cd vdpm
          ./bootstrap-vitasdk.sh
          export PATH="$VITASDK/bin:$PATH"
          ./install-all.sh
          echo "$VITASDK/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake"
          cd build
          make

      - name: List build outputs
        run: ls -lh build

      - name: Upload VPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-vpk
          path: build/*.vpk